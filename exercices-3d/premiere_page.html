<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expo Artemisia - Salle 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .scene {
      width: 100vw;
      height: 100vh;
      perspective: 800px;
      perspective-origin: 50% 50%;
      overflow: hidden;
      background: #0d0d0d;
    }

    .room {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .wall {
      position: absolute;
      width: 600px;
      height: 600px;
      top: 50%;
      left: 50%;
      margin-top: -200px;
      margin-left: -300px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #b8952a;
      background: #0c0906;
    }

    .wall-center { transform: translateZ(-300px); }
    .wall-left   { transform: rotateY(90deg)  translateZ(-300px); }
    .wall-right  { transform: rotateY(-90deg) translateZ(-300px); }

    .wall-center img {
      max-height: 57%;
      width: auto;
      object-fit: contain;
    }

    .ceiling {
      transform: rotateX(-90deg) translateZ(-300px);
      transform-style: preserve-3d;
    }

    .projecteur {
      position: absolute;
      width: 60px;
      height: 25px;
      background: #1a1a1a;
      border: 1px solid #b8952a;
      border-radius: 4px;
      transform: translateZ(20px);
      transform-style: preserve-3d;
    }
    .proj-centre {
      top: 50%;
      left: 50%;
      margin-top: -12px;
      margin-left: -30px;
    }

    /* Media query TOUJOURS en dernier, pour gagner la priorité sur mobile */
    @media (max-width: 700px) {
      .scene { perspective: 400px; }
      .wall {
        width: 70vw;
        height: 70vw;
        margin-top: -35vw;
        margin-left: -35vw;
      }
      .wall-center { transform: translateZ(-35vw); }
      .wall-left   { transform: rotateY(90deg)  translateZ(-35vw); }
      .wall-right  { transform: rotateY(-90deg) translateZ(-35vw); }
      .ceiling     { transform: rotateX(-90deg) translateZ(-35vw); }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="room">
      <div class="wall wall-left"><h2>MUR GAUCHE</h2></div>
      <div class="wall wall-center">
        <img src="https://raw.githubusercontent.com/Franckmastel/Expo-Artemisia-/main/suzanne.jpg"
             alt="Suzanne et les vieillards">
      </div>
      <div class="wall wall-right"><h2>MUR DROIT</h2></div>
      <div class="wall ceiling">
        <h2>PLAFOND</h2>
        <div class="projecteur proj-centre"></div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var scene = document.querySelector('.scene');
    var room = document.querySelector('.room');

    var maxAngleY = 25;
    var maxAngleX = 6;

    scene.addEventListener('mousemove', function (e) {
      var rect = scene.getBoundingClientRect();
      var xPercent = (e.clientX - rect.left) / rect.width - 0.5;
      var yPercent = (e.clientY - rect.top) / rect.height - 0.5;
      var angleY = xPercent * maxAngleY * 2;
      var angleX = -yPercent * maxAngleX * 2;
      room.style.transform = 'rotateX(' + angleX + 'deg) rotateY(' + angleY + 'deg)';
    });

    scene.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var touch = e.touches[0];
      var rect = scene.getBoundingClientRect();
      var xPercent = (touch.clientX - rect.left) / rect.width - 0.5;
      var yPercent = (touch.clientY - rect.top) / rect.height - 0.5;
      var angleY = xPercent * maxAngleY * 2;
      var angleX = -yPercent * maxAngleX * 2;
      room.style.transform = 'rotateX(' + angleX + 'deg) rotateY(' + angleY + 'deg)';
    }, { passive: false });

    scene.addEventListener('mouseleave', function () {
      room.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  })();
  </script>

</body>
</html>
